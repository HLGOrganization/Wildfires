buildscript {
    repositories {
        // These repositories are only for Gradle plugins, put any other repositories in the repository block further below
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

ext.tfeVersion = '2.0.1'
ext.tfeReleaseSha256 = '029AD1A7368B687BCD435B4321257BA8DD9E9D3B8533FC248BD43CEB5CE5A308'
ext.tfeLocalJar = file(".wildfires-cache/tfe-release/Wildfire_TerraFirmaEarth-1.20.1-forge-${tfeVersion}.jar")
ext.tfeUserdevInputVersion = "${tfeVersion}-wildfires-userdev-1"
ext.tfeUserdevInputSha256 = 'D92F9CF012E0F8C90BA36F4C69F469FD15B8D4DD8CC3E331CE55B905AB5371CF'
ext.tfeUserdevInputJar = file(".wildfires-cache/tfe-userdev-input/Wildfire_TerraFirmaEarth-1.20.1-forge-${tfeUserdevInputVersion}.jar")

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    // The mappings can be changed at any time and must be in the following format.
    // Channel:   Version:
    // official   MCVersion             Official field/method names from Mojang mapping files
    // parchment  YYYY.MM.DD-MCVersion  Open community-sourced parameter names and javadocs layered on top of official
    //
    // You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Parchment is an unofficial project maintained by ParchmentMC, separate from MinecraftForge
    // Additional setup is needed to use their mappings: https://parchmentmc.org/docs/getting-started
    //
    // Use non-default mappings at your own risk. They may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    // When true, this property will have all Eclipse/IntelliJ IDEA run configurations run the "prepareX" task for the given run configuration before launching the game.
    // In most cases, it is not necessary to enable.
    // enableEclipsePrepareRuns = true
    // enableIdeaPrepareRuns = true

    // This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
    // It is REQUIRED to be set to true for this template to function.
    // See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
    copyIdeResources = true

    // When true, this property will add the folder name of all declared run configurations to generated IDE run configurations.
    // The folder name can be set on a run configuration using the "folderName" property.
    // By default, the folder name of a run configuration is the name of the Gradle project containing it.
    // generateRunFolders = true

    // This property enables access transformers for use in development.
    // They will be applied to the Minecraft artifact.
    // The access transformer file can be anywhere in the project.
    // However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
    // This default location is a best practice to automatically put the file in the right place in the final jar.
    // See https://docs.minecraftforge.net/en/latest/advanced/accesstransformers/ for more information.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id

            // Keep the large development modpack inside a predictable Windows commit budget.
            // This affects only ForgeGradle's development client, not the distributed mod.
            jvmArgs '-Xms1G', '-Xmx8G'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.test
                }
            }
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"

    config "${mod_id}.mixins.json"
}
// 这四个 create 兼容 mixin 已经在 wildfires.mixins.json 里注销（obsolete / dead code / ported natively），
// 但源码里还留着 @Inject 方法，Mixin 注解处理器会因此报错导致编译失败。
// 这里只把源码排除出编译，文件仍保留在仓库里备查；若以后要重新启用，删掉下面四行并把 mixins.json 里的条目放出来。
sourceSets.main.java.exclude 'first/wildfires/mixin/create/WoodenCogForgeHeatLevelMixin.java'
sourceSets.main.java.exclude 'first/wildfires/mixin/create/WoodenCogMoldHeatMixin.java'
sourceSets.main.java.exclude 'first/wildfires/mixin/create/WoodenCogMoreBurnerTemperatureMixin.java'
sourceSets.main.java.exclude 'first/wildfires/mixin/create/FanOverheatMixin.java'

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        name = "Local TerraFirmaEarth"
        dirs ".wildfires-cache/tfe-userdev-input"
    }
    // Create ecosystem and createmetallurgy, pinned to the versions the modpack ships.
    // createmetallurgy 1.0.1 has no matching public Maven artifact, and the Create 6.0.8
    // coordinate carries a build suffix that cannot be resolved offline, so both are
    // consumed as the modpack's own jars.
    flatDir {
        name = "Local Create ecosystem"
        dirs ".wildfires-cache/local-mods"
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
    maven { url = "https://maven.bawnorton.com/releases" }
    maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    //curios
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    //create
    // Pinned to the Create ecosystem the modpack ships (jars under .wildfires-cache/local-mods).
    // The published Create coordinate carries a build suffix (for example 6.0.6-150) that cannot
    // be resolved without network access, so the modpack's own jar is consumed. flywheel and
    // ponder are bundled inside Create at runtime, but their classes are still needed here: the
    // compile classpath needs them, and dev runs do not unwrap Create's nested jars.
    // catnip, used across the client code, ships inside Ponder.
    implementation(fg.deobf("local.create:create-${minecraft_version}:${create_version}") { transitive = false })
    implementation(fg.deobf("local.create:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    compileOnly(fg.deobf("local.create:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    runtimeOnly(fg.deobf("local.create:flywheel-forge-${minecraft_version}:${flywheel_version}"))
    // Registrate ships inside the pinned Create jar (META-INF/jarjar). Declaring it as a runtime
    // implementation as well puts two automatic modules exporting com.tterrag.registrate.providers
    // on the module path, and ModLauncher fails with a ResolutionException before the game starts.
    // The embedded copy is what runs, so this stays compile-only.
    compileOnly(fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation("io.github.llamalad7:mixinextras-forge:0.4.1")
    //tfc
    implementation fg.deobf("curse.maven:terrafirmacraft-302973:7442504")
    // TFE 2.0.1 has no matching public source/tag or named dev release. A verified, local-only preprocessing task
    // prevents its NTELeopardSeal helper from colliding with Minecraft's mapped isFood method in ForgeGradle userdev.
    compileOnly fg.deobf("local.tfe:Wildfire_TerraFirmaEarth-1.20.1-forge:${tfeUserdevInputVersion}")
    runtimeOnly fg.deobf("local.tfe:Wildfire_TerraFirmaEarth-1.20.1-forge:${tfeUserdevInputVersion}")

    //patchouli
    implementation fg.deobf("curse.maven:patchouli-306770:6164575")
    //jei
    implementation fg.deobf("curse.maven:jei-238222:7920915")
    //legendarysurvivaloverhaul
    implementation fg.deobf("curse.maven:legendary-survival-overhaul-840254:6286507")
    //jade
    implementation fg.deobf("curse.maven:jade-324717:6855440")
    //kjs
    implementation fg.deobf("curse.maven:kubejs-238086:5853326")
    implementation fg.deobf("curse.maven:rhino-416294:6186971")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:probejs-585406:5227399")
    implementation fg.deobf("curse.maven:eventjs-1132802:7143082")
    //geckolib
    implementation fg.deobf("curse.maven:geckolib-388172:6789487")
    //spartan-weaponry
    implementation fg.deobf("curse.maven:spartan-weaponry-278141:5597663")
    //irons-spells
    compileOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6970299")
    runtimeOnly fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:6970299")
    runtimeOnly fg.deobf("maven.modrinth:caelus:3.2.0+1.20.1")
    runtimeOnly fg.deobf("maven.modrinth:playeranimator:1.0.2-rc1+1.20-forge")
    //kubejs-tfc
    implementation fg.deobf("curse.maven:kubejs-tfc-841001:6201323")
    //create-metallurgy
    implementation fg.deobf("local.create:createmetallurgy:${createmetallurgy_version}")
    // Survivors Arsenal: satchels and backpacks are registered as BackpackItem, so the
    // modpack's own sa_essentials jar is needed on the compile classpath to subclass it.
    // sa_lib provides sa_core, which sa_essentials declares as a required dependency.
    compileOnly fg.deobf("local.create:sa_essentials-forge-${minecraft_version}:${sa_essentials_version}")
    compileOnly fg.deobf("local.create:sa_lib-forge-${minecraft_version}:${sa_core_version}")
    //citadel
    implementation fg.deobf("curse.maven:citadel-331936:6702068")
    //alexs-caves
    implementation fg.deobf("curse.maven:alexs-caves-924854:5848216")
    //Aquaculture
    implementation fg.deobf("curse.maven:aquaculture-60028:7331172")
    //firmalife
    implementation fg.deobf("curse.maven:firmalife-453394:7602336")
    //farmers-delight
    implementation fg.deobf("curse.maven:farmers-delight-398521:8083474")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // Keep the license evidence next to the exact binary and resources it covers.
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    from(rootProject.file('third_party')) {
        into 'third_party'
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1", // We are version 1 of ourselves
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Pure verification JVMs do not need Java 21's machine-sized ergonomic heap. Keeping them
// bounded prevents an orphaned/parallel self-test from exhausting Windows commit while the
// development client is running; ForgeGradle run configurations retain their own limits.
tasks.withType(JavaExec).matching { it.name.endsWith('SelfTest') }.configureEach {
    minHeapSize = '256m'
    maxHeapSize = '2g'
}

apply from: 'gradle/tfe-dev-bootstrap.gradle'

tasks.register('celestialMathSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic unified celestial mathematics, body and packet checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.celestial.CelestialMathSelfTest'
}

tasks.register('celestialClientSelfTest', JavaExec) {
    group = 'verification'
    description = 'Run deterministic star-table and client celestial visual-rule checks.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.client.celestial.CelestialClientSelfTest'
}

tasks.register('calendarRateSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for TFC calendar-rate accumulation.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.tfc.calendar.CalendarRateAccumulatorSelfTest'
}

tasks.register('spaceCoreSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for fixed-station route and journey state transitions.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpaceCoreSelfTest'
}

tasks.register('spacePersistenceSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for global station SavedData, region allocation, and recovery.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpacePersistenceSelfTest'
}

tasks.register('spaceObservationSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for orbit observation snapshots and packet ordering.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpaceObservationSelfTest'
}

tasks.register('spaceTravelSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for atomic station departure transactions and C2S intent.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.SpaceTravelSelfTest'
}

tasks.register('spaceVisualSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for NTM/Genesis orbit visuals, phase turns, and travel LOD.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.client.space.render.SpaceVisualSelfTest'
}

tasks.register('returnCapsuleSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs pure Forge-fluid, ticket and stable-state checks for the reusable return capsule.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.space.ReturnCapsuleSelfTest'
}

tasks.register('galaxyHymnSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for Galaxy Hymn damage, timing, targeting, and shader contracts.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.compats.irons_spellbooks.GalaxyHymnSelfTest'
}

tasks.register('depositLootSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for the sluice and panning loot-table probability maths.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.jei.DepositLootSelfTest'
}

tasks.register('forgingPathSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for the forging manual target and shortest-path search.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.smithing.ForgePathFinderSelfTest'
}

tasks.register('perfectForgeDataSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for perfect-forge records, resets, and save compatibility.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.smithing.PerfectForgeDataSelfTest'
}

tasks.register('forgeMemoryDataSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for the remembered forging sequences and their save shape.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.smithing.ForgeMemoryDataSelfTest'
}

tasks.register('forgePlanSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for the one-click forge blow search.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.smithing.ForgePlanSelfTest'
}

tasks.register('forgeMemoryResumeSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for picking an interrupted memory forge up where it stopped.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.smithing.ForgeMemoryResumeSelfTest'
}

tasks.register('perfectForgeRulesSelfTest', JavaExec) {
    group = 'verification'
    description = 'Runs plain-Java checks for the experience and odds that unlock a one-click forge.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'first.wildfires.smithing.PerfectForgeRulesSelfTest'
}

tasks.named('check').configure {
    dependsOn tasks.named('celestialMathSelfTest'), tasks.named('celestialClientSelfTest'),
            tasks.named('calendarRateSelfTest'), tasks.named('spaceCoreSelfTest'),
            tasks.named('spacePersistenceSelfTest'), tasks.named('spaceObservationSelfTest'),
            tasks.named('spaceTravelSelfTest'), tasks.named('spaceVisualSelfTest')
    dependsOn tasks.named('returnCapsuleSelfTest'), tasks.named('galaxyHymnSelfTest')
    dependsOn tasks.named('depositLootSelfTest')
    dependsOn tasks.named('forgingPathSelfTest')
    dependsOn tasks.named('perfectForgeDataSelfTest')
    dependsOn tasks.named('forgeMemoryDataSelfTest')
    dependsOn tasks.named('forgePlanSelfTest')
    dependsOn tasks.named('forgeMemoryResumeSelfTest')
    dependsOn tasks.named('perfectForgeRulesSelfTest')
}
