import java.nio.charset.StandardCharsets
import java.security.MessageDigest
import java.util.jar.JarFile
import java.util.jar.JarEntry
import java.util.jar.JarOutputStream

def tfeVersion = project.ext.tfeVersion.toString()
def tfeReleaseSha256 = project.ext.tfeReleaseSha256.toString()
def tfeLocalJar = project.ext.tfeLocalJar as File
def tfeUserdevInputVersion = project.ext.tfeUserdevInputVersion.toString()
def tfeUserdevInputSha256 = project.ext.tfeUserdevInputSha256.toString()
def tfeUserdevInputJar = project.ext.tfeUserdevInputJar as File
def tfeClimateMixinEntry = 'com/newterraearth/tfe/mixin/client/ClimateScreenMixin.class'
def tfeHemisphereHelperEntry = 'com/newterraearth/tfe/client/NTEClimateRenderHelpers.class'
def tfeLeopardSealEntry = 'com/newterraearth/tfe/common/entity/aquatic/NTELeopardSeal.class'
def tfeLeopardSealHelperName = 'isFood'
def tfeLeopardSealUserdevHelperName = 'wildfires$tfeIsFood'

def sha256 = { File input ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 128]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) {
                digest.update(buffer, 0, count)
            }
        }
    }
    digest.digest().collect { String.format('%02X', it & 0xFF) }.join()
}

def inspectTfeJar = { File candidate ->
    if (!candidate.isFile()) {
        return [valid: false, reason: "missing local release JAR ${candidate}"]
    }

    try {
        new JarFile(candidate).withCloseable { jar ->
            def implementationVersion = jar.manifest?.mainAttributes?.getValue('Implementation-Version')
            if (implementationVersion != tfeVersion) {
                return [valid: false, reason: "Implementation-Version is ${implementationVersion ?: 'missing'}, expected ${tfeVersion}"]
            }

            def modsEntry = jar.getJarEntry('META-INF/mods.toml')
            if (modsEntry == null) {
                return [valid: false, reason: 'META-INF/mods.toml is missing']
            }
            def modsToml = jar.getInputStream(modsEntry).withCloseable {
                new String(it.readAllBytes(), StandardCharsets.UTF_8)
            }
            if (!(modsToml =~ /(?m)^\s*modId\s*=\s*["']tfe["']\s*$/)) {
                return [valid: false, reason: 'mods.toml does not declare modId=tfe']
            }

            for (String requiredEntry : [tfeClimateMixinEntry, tfeHemisphereHelperEntry, 'tfe.mixins.json']) {
                if (jar.getJarEntry(requiredEntry) == null) {
                    return [valid: false, reason: "required TFE compatibility entry is missing: ${requiredEntry}"]
                }
            }
            def climateMixinBytes = jar.getInputStream(jar.getJarEntry(tfeClimateMixinEntry)).withCloseable {
                new String(it.readAllBytes(), StandardCharsets.ISO_8859_1)
            }
            if (!climateMixinBytes.contains('m_280003_') || !climateMixinBytes.contains('translationKey')) {
                return [valid: false, reason: 'production climate-screen compatibility probes are absent']
            }
            def helperBytes = jar.getInputStream(jar.getJarEntry(tfeHemisphereHelperEntry)).withCloseable {
                new String(it.readAllBytes(), StandardCharsets.ISO_8859_1)
            }
            if (!helperBytes.contains('getHemisphereScale')) {
                return [valid: false, reason: 'hemisphere helper compatibility probe is absent']
            }

            String actualHash = sha256(candidate)
            if (!actualHash.equalsIgnoreCase(tfeReleaseSha256)) {
                return [valid: false, reason: "SHA-256 is ${actualHash}, expected ${tfeReleaseSha256}"]
            }
            return [valid: true, reason: 'TFE release identity, binary compatibility probes, and SHA-256 are valid', sha256: actualHash]
        }
    } catch (Exception failure) {
        return [valid: false, reason: "cannot read JAR: ${failure.message}"]
    }
}

def rewriteExactClassUtf8 = { byte[] classBytes, String oldValue, String newValue ->
    def input = new DataInputStream(new ByteArrayInputStream(classBytes))
    def bytes = new ByteArrayOutputStream(classBytes.length + 64)
    def output = new DataOutputStream(bytes)
    int magic = input.readInt()
    if (magic != 0xCAFEBABE as int) {
        throw new GradleException('TFE userdev patch target is not a Java class file')
    }
    output.writeInt(magic)
    output.writeShort(input.readUnsignedShort())
    output.writeShort(input.readUnsignedShort())
    int constantPoolCount = input.readUnsignedShort()
    output.writeShort(constantPoolCount)
    int replacements = 0
    for (int index = 1; index < constantPoolCount; index++) {
        int tag = input.readUnsignedByte()
        output.writeByte(tag)
        switch (tag) {
            case 1:
                int length = input.readUnsignedShort()
                byte[] valueBytes = input.readNBytes(length)
                String value = new String(valueBytes, StandardCharsets.UTF_8)
                if (value == oldValue) {
                    valueBytes = newValue.getBytes(StandardCharsets.UTF_8)
                    replacements++
                }
                output.writeShort(valueBytes.length)
                output.write(valueBytes)
                break
            case 3:
            case 4:
                output.write(input.readNBytes(4))
                break
            case 5:
            case 6:
                output.write(input.readNBytes(8))
                index++
                break
            case 7:
            case 8:
            case 16:
            case 19:
            case 20:
                output.write(input.readNBytes(2))
                break
            case 9:
            case 10:
            case 11:
            case 12:
            case 17:
            case 18:
                output.write(input.readNBytes(4))
                break
            case 15:
                output.write(input.readNBytes(3))
                break
            default:
                throw new GradleException("Unsupported constant-pool tag ${tag} in ${tfeLeopardSealEntry}")
        }
    }
    output.write(input.readAllBytes())
    output.flush()
    if (replacements != 1) {
        throw new GradleException("Expected exactly one ${oldValue} UTF-8 entry in ${tfeLeopardSealEntry}, found ${replacements}")
    }
    bytes.toByteArray()
}

def inspectTfeUserdevInput = { File candidate ->
    if (!candidate.isFile()) {
        return [valid: false, reason: "missing generated userdev input JAR ${candidate}"]
    }
    try {
        new JarFile(candidate).withCloseable { jar ->
            def entry = jar.getJarEntry(tfeLeopardSealEntry)
            if (entry == null) {
                return [valid: false, reason: "userdev patch target is missing: ${tfeLeopardSealEntry}"]
            }
            byte[] bytes = jar.getInputStream(entry).withCloseable { it.readAllBytes() }
            String classText = new String(bytes, StandardCharsets.ISO_8859_1)
            if (!classText.contains(tfeLeopardSealUserdevHelperName) || !classText.contains('m_6898_')) {
                return [valid: false, reason: 'NTELeopardSeal userdev method-collision patch is absent']
            }
            String actualHash = sha256(candidate)
            // [LOCAL BUILD] 当 tfeUserdevInputSha256 为占位值 'AUTO' 时跳过哈希比对，
            // 仅保留补丁存在性校验。生成后可用 tfeDevJarStatus 回填真实哈希。
            if (tfeUserdevInputSha256 != 'AUTO' && !actualHash.equalsIgnoreCase(tfeUserdevInputSha256)) {
                return [valid: false, reason: "userdev input SHA-256 is ${actualHash}, expected ${tfeUserdevInputSha256}"]
            }
            return [valid: true, reason: 'local TFE userdev input contains the verified NTELeopardSeal mapping-collision patch', sha256: actualHash]
        }
    } catch (Exception failure) {
        return [valid: false, reason: "cannot read generated userdev input JAR: ${failure.message}"]
    }
}

def generateTfeUserdevInput = {
    def releaseState = inspectTfeJar(tfeLocalJar)
    if (!releaseState.valid) {
        throw new GradleException("TerraFirmaEarth ${tfeVersion} runtime verification failed: ${releaseState.reason}. " +
            "Place the authorized ${tfeVersion} release at ${tfeLocalJar}; it is intentionally not downloaded or redistributed by Wildfires.")
    }
    tfeUserdevInputJar.parentFile.mkdirs()
    File temporary = new File(tfeUserdevInputJar.parentFile, "${tfeUserdevInputJar.name}.tmp")
    if (temporary.exists() && !temporary.delete()) {
        throw new GradleException("Cannot replace temporary TFE userdev JAR ${temporary}")
    }
    new JarFile(tfeLocalJar).withCloseable { source ->
        new JarOutputStream(new BufferedOutputStream(new FileOutputStream(temporary))).withCloseable { output ->
            def entries = source.entries()
            boolean patched = false
            while (entries.hasMoreElements()) {
                def sourceEntry = entries.nextElement()
                def targetEntry = new JarEntry(sourceEntry.name)
                targetEntry.time = 0L
                output.putNextEntry(targetEntry)
                if (!sourceEntry.isDirectory()) {
                    byte[] content = source.getInputStream(sourceEntry).withCloseable { it.readAllBytes() }
                    if (sourceEntry.name == tfeLeopardSealEntry) {
                        content = rewriteExactClassUtf8(content, tfeLeopardSealHelperName, tfeLeopardSealUserdevHelperName)
                        patched = true
                    }
                    output.write(content)
                }
                output.closeEntry()
            }
            if (!patched) {
                throw new GradleException("TFE userdev patch target is missing: ${tfeLeopardSealEntry}")
            }
        }
    }
    try {
        java.nio.file.Files.move(temporary.toPath(), tfeUserdevInputJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    } catch (java.nio.file.AtomicMoveNotSupportedException ignored) {
        java.nio.file.Files.move(temporary.toPath(), tfeUserdevInputJar.toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
    def state = inspectTfeUserdevInput(tfeUserdevInputJar)
    if (!state.valid) {
        throw new GradleException("Generated TerraFirmaEarth userdev input failed verification: ${state.reason}")
    }
    logger.lifecycle("[TFE bootstrap] Generated local-only TFE ${tfeVersion} userdev input (${state.sha256}).")
    state
}

tasks.register('verifyTfeRuntime') {
    group = 'verification'
    description = "Verify the pinned local TerraFirmaEarth ${tfeVersion} release used by ForgeGradle userdev."
    inputs.file(tfeLocalJar)
    inputs.property('tfeVersion', tfeVersion)
    inputs.property('tfeReleaseSha256', tfeReleaseSha256)
    doLast {
        def state = inspectTfeJar(tfeLocalJar)
        if (!state.valid) {
            throw new GradleException("TerraFirmaEarth ${tfeVersion} runtime verification failed: ${state.reason}. " +
                "Place the authorized ${tfeVersion} release at ${tfeLocalJar}; it is intentionally not downloaded or redistributed by Wildfires.")
        }
        logger.lifecycle("[TFE bootstrap] Verified local TFE ${tfeVersion} release (${state.sha256}).")
    }
}

def prepareTfeUserdevInput = tasks.register('prepareTfeUserdevInput') {
    group = 'build setup'
    description = "Generate the local-only ForgeGradle input for TerraFirmaEarth ${tfeVersion}."
    dependsOn tasks.named('verifyTfeRuntime')
    inputs.file(tfeLocalJar)
    inputs.property('tfeUserdevInputVersion', tfeUserdevInputVersion)
    outputs.file(tfeUserdevInputJar)
    outputs.upToDateWhen { inspectTfeUserdevInput(tfeUserdevInputJar).valid }
    doLast {
        generateTfeUserdevInput()
    }
}

tasks.register('tfeDevJarStatus') {
    group = 'help'
    description = 'Report whether the local TFE release matches the pinned userdev dependency.'
    doLast {
        def state = inspectTfeJar(tfeLocalJar)
        logger.lifecycle("[TFE bootstrap] valid=${state.valid}; ${state.reason}${state.sha256 ? "; sha256=${state.sha256}" : ''}")
        def userdevState = inspectTfeUserdevInput(tfeUserdevInputJar)
        logger.lifecycle("[TFE bootstrap] userdevValid=${userdevState.valid}; ${userdevState.reason}${userdevState.sha256 ? "; sha256=${userdevState.sha256}" : ''}")
    }
}

tasks.withType(JavaCompile).configureEach {
    dependsOn prepareTfeUserdevInput
}

tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer', 'runData'] }.configureEach {
    dependsOn prepareTfeUserdevInput
}

// flatDir artifacts must exist before ForgeGradle resolves its synthetic deobfuscation configuration. Tasks alone
// run too late on a fresh checkout, so configuration verifies or creates this ignored, deterministic input once.
def configuredUserdevState = inspectTfeUserdevInput(tfeUserdevInputJar)
if (!configuredUserdevState.valid) {
    logger.lifecycle("[TFE bootstrap] Preparing userdev input during configuration: ${configuredUserdevState.reason}")
    generateTfeUserdevInput()
}
